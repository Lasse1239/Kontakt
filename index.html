<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine digitale Visitenkarte</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px;
      background: #f5f5f7;
      color: #111;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 4px 20px #0001;
    }

    .profilbild {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .firma {
      color: #666;
      margin-top: 4px;
      margin-bottom: 20px;
      font-size: 18px;
    }

    p {
      line-height: 1.6;
      margin: 8px 0;
    }

    .button {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #111;
      color: white;
      padding: 14px;
      border-radius: 12px;
      margin-top: 24px;
    }

    .hinweis {
      font-size: 13px;
      color: #666;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="card">

    <img src="profilbild.jpg" alt="Profilbild" class="profilbild">

    <h1>Lasse Szygulla</h1>

    <div class="firma">
      LS Agrarfocus
    </div>

    <p>📞 <a href="tel:+4915771494909">+49 1577 1494909</a></p>

    <p>📧 <a href="mailto:lasse.szygulla@gmx.de">
      lasse.szygulla@gmx.de
    </a></p>

    <p>📧 <a href="mailto:kontakt@meinefirma.de">
      ls.agrarfocus@gmx.de
    </a></p>

    <a class="button" href="kontakt.vcf">
      Kontakt hinzufügen
    </a>

    <p class="hinweis">
      Tippe auf „Kontakt hinzufügen“, um die Kontaktdaten auf deinem iPhone zu speichern.
    </p>

  </main>
</body>
</html>
